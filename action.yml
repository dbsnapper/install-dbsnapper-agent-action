name: 'Install DBSnapper Agent'
description: 'Install the DBSnapper Agent in a GitHub Actions workflow'
author: 'DBSnapper'

# Add your action's branding here. This will appear on the GitHub Marketplace.
branding:
  icon: 'database'
  color: 'blue'

# Define your inputs here.
inputs:
  version:
    description:
      'Version of the DBSnapper Agent to install (2.9.0 or v2.9.0); latest is
      the newest release that is not a pre-release'
    required: false
    default: latest
  token:
    description:
      'GitHub token for the latest-release lookup on api.github.com (only
      there); the default is the workflow token, which lifts the anonymous limit
      of 60 lookups per hour'
    required: false
    default: ${{ github.token }}

runs:
  using: node20
  main: dist/index.js
