name: Lint Codebase

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  lint:
    name: Lint Codebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: install
        run: npm ci

      - name: Lint Codebase
        id: super-linter
        uses: super-linter/super-linter/slim@v6
        env:
          DEFAULT_BRANCH: main
          FILTER_REGEX_EXCLUDE: dist/**/*
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # actionlint 1.7.1 in super-linter v6 knows only node16/node20 and
          # rejects action.yml's `using: node24` (GitHub runs it; actionlint
          # accepts it from 1.7.8, super-linter v8.3.0). Drop this line after
          # that bump. super-linter splits the value at spaces, so the regular
          # expression has none: it matches `runner name "node24"`.
          GITHUB_ACTIONS_COMMAND_ARGS: -ignore=runner.name..node24.
          # ESLint (TYPESCRIPT_ES) and Prettier check TypeScript with the
          # repository's own configuration. TYPESCRIPT_DEFAULT_STYLE, which
          # once turned ts-standard off, is ignored since super-linter v6.
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_JAVASCRIPT_STANDARD: false
          VALIDATE_JSCPD: false
          VALIDATE_TYPESCRIPT_STANDARD: false
