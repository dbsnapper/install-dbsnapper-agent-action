name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    # arm64 too: the action picks the archive by the runner's architecture
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Test Local Action Latest Version
        id: test-action-latest-version
        uses: ./
        with:
          version: latest

      - name: Test Local Action Specific Version
        id: test-action-specific-version
        uses: ./
        with:
          version: v2.7.1

      # A green install step alone does not prove the agent runs: this one
      # calls it from PATH. The last install wins (its directory comes first).
      # The agent must be the file an install unpacked: named dbsnapper,
      # executable, in a directory of its own right under the runner's
      # temporary directory (tool-cache's extractTar), not a copy from elsewhere
      - name: Run Installed Agent
        id: run-installed-agent
        shell: bash
        run: |
          agent="$(command -v dbsnapper)"
          echo "$agent"
          if [[ "$(basename "$agent")" != dbsnapper ||
            "$(dirname "$(dirname "$agent")")" != "${RUNNER_TEMP%/}" ||
            ! -f "$agent" || ! -x "$agent" ]]; then
            echo "::error::dbsnapper on PATH is '$agent': not an executable" \
              "file named dbsnapper in a directory under RUNNER_TEMP"
            exit 1
          fi
          version="$(dbsnapper --version)"
          echo "$version"
          grep -q -E '^DBSnapper Agent - Version: 2\.7\.1 ' <<<"$version"
